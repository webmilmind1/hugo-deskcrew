tags = ["component", "support", "chat", "live chat", "helpdesk", "widget", "ai", "chatbot", "docs", "documentation", "knowledge base", "contact", "customer service", "saas"]
features = ["theme component", "live chat", "ai chatbot", "support tickets", "help center", "knowledge base", "contact form replacement", "hugo module", "no javascript to write"]
min_version = "0.110.0"

