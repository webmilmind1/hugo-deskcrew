description = "Live chat, AI support chatbot and help center for Hugo sites. A theme component that adds the DeskCrew support widget to every page from one partial and a few lines in hugo.toml: visitors get answers from your knowledge base, unanswered questions become tickets, and a human approves every reply. Works alongside any theme (PaperMod, Docsy, Hextra, Book, Ananke). Free plan."
homepage = "https://deskcrew.io/integrations/hugo"
